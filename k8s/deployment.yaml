apiVersion: apps/v1
kind: Deployment
metadata:
  name: placementhub-deployment
  labels:
    app: placementhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placementhub
  template:
    metadata:
      labels:
        app: placementhub
    spec:
      containers:
        - name: placementhub
          image: ghcr.io/skit-devops-2026/devops-24eskcs018:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
