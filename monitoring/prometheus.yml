global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'placementhub-app'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['web:3000']
        labels:
          app: 'placementhub'
          environment: 'production'
